  }
  *{box-sizing:border-box;}
  #curr-root{

  }

  }
  .college-logo{
    height:58px;width:58px;object-fit:contain;background:#fff;border-radius:50%;

  }
  .college-name{
    color:#F6F2E8;font-size:19px;font-weight:700;letter-spacing:0.02em;line-height:1.2;
  }
  .college-sub{
    color:#F0B8B8;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;margin-top:3px;
  }
  .curr-header{
    padding:28px 32px 18px 32px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  .curr-header h1{
    margin:0 0 4px 0;
    font-size:28px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .curr-header .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  .curr-actions{display:flex;gap:10px;align-items:center;}
  .btn{
    font-family:inherit;
    border:1px solid var(--ink);

    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    border-radius:2px;
    transition:background .15s,color .15s;
  }
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.gold{border-color:var(--gold-deep);color:var(--gold-deep);}
  .btn.gold:hover{background:var(--gold-deep);color:var(--paper);}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger);color:var(--paper);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:0.4;cursor:default;}
  .btn:disabled:hover{background:transparent;color:var(--ink);}

  .reg-toggle{
    display:flex;gap:6px;padding:14px 32px 0 32px;
  }
  .reg-btn{
    font-family:inherit;background:var(--paper-2);border:1px solid var(--rule);color:var(--ink-soft);

function ensureTracks(){
  if (!DB.tracks){
    DB.tracks = R26_TRACKS_DEFAULT.map(tr => ({
      track: tr.track,
      elective: tr.elective.map(name => ({code:newCourseId(), name})),
      honours: tr.honours ? tr.honours.map(name => ({code:newCourseId(), name})) : null,
    }));
    // Not auto-saved — rides along with the next real save, same reasoning as R26 semesters.
  }
}

// Returns every known course (R25 + whatever's been added to R26 + track electives/honours).
function allCourses(){
  const r26courses = [];
  (DB.r26 && DB.r26.semesters ? DB.r26.semesters : []).forEach(s => s.courses.forEach(c => r26courses.push({code:c.code, name:c.name})));
  const trackCourses = [];
  (DB.tracks || []).forEach(tr => {
    tr.elective.forEach(c => trackCourses.push({code:c.code, name:c.name}));
    if (tr.honours) tr.honours.forEach(c => trackCourses.push({code:c.code, name:c.name}));
  });
  return ALL_COURSES_R25.concat(r26courses, trackCourses);
}

function newCourseId(){
  return "r26-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
}

function ensureR26(){
  const isFresh = !DB.r26 || !DB.r26.semesters;
  if (isFresh){
    const years = ["I","I","II","II","III","III","IV","IV"];
    DB.r26 = { semesters: [1,2,3,4,5,6,7,8].map(n => ({sem:n, year:years[n-1], courses:[]})) };
    seedR26Defaults();
    // Don't auto-save here — it can race with a save the user triggers right after
    // (e.g. uploading a syllabus), and whichever write finishes last would silently
    // overwrite the other. The seed lives in memory and rides along with the next
    // real save (upload, add/delete subject) automatically.
  }
}

function driveHeaders(){ return { Authorization: "Bearer " + accessToken }; }

async function driveApi(url, opts){
  const res = await fetch(url, opts);
  if (!res.ok){
    const body = await res.text().catch(()=>"") ;
    throw new Error("Drive API " + res.status + ": " + body.slice(0,200));
  }
  return res;
}

// Viewer mode: fetch a file with just the public API key, no login.
async function fetchPublicFile(fileId){
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${CONFIG.apiKey}`;
  const res = await driveApi(url);
  return res.json();
}

// Editor mode: find (or create) a named file in the owner's Drive, using their OAuth token.
async function findOrCreateFile(name, initialContent){
  const q = encodeURIComponent(`name='${name}' and trashed=false`);
  const listRes = await driveApi(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
    { headers: driveHeaders() }
  );
  const listJson = await listRes.json();
  if (listJson.files && listJson.files.length){
    return listJson.files[0].id;
  }
  const metadata = { name, mimeType: "application/json" };
  const boundary = "curr_app_boundary";
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(initialContent)}\r\n` +
    `--${boundary}--`;
  const createRes = await driveApi(
    "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
    { method: "POST", headers: { ...driveHeaders(), "Content-Type": `multipart/related; boundary=${boundary}` }, body }
  );
  const createJson = await createRes.json();
  return createJson.id;
}

async function loadFileContent(fileId){
  const res = await driveApi(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: driveHeaders() }
  );
  return res.json();
}

async function writeFileContent(fileId, content){
  await driveApi(
    `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
    { method: "PATCH", headers: { ...driveHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(content) }
  );
}

  await writeFileContent(driveFileId, DB);

  if (isPublic){

      try{ await syncSharedCopy(sharePassword); shareOutOfSync = false; }
      catch(e){ console.error("Shared copy sync failed:", e); shareOutOfSync = true; }
    } else {
      shareOutOfSync = true; // sharing is on, but we don't have the password this session
    }
  }
}

// ---------------------------------------------------------------------------
// Client-side encryption (Web Crypto) — the shared file's content is unreadable
// without the password, even though the Drive permission on it is "anyone with
// the link can view." "Stop sharing" also removes that permission outright.
// ---------------------------------------------------------------------------
function b64encode(buf){
  // Chunked on purpose: spreading a large byte array straight into
  // String.fromCharCode(...) blows past JS's max-arguments limit once the
  // curriculum data (and its syllabi) gets big enough — this avoids that.
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}
function b64decode(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function deriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: saltBytes, iterations: 150000, hash:"SHA-256"},
    keyMaterial, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}

async function encryptJSON(obj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const plaintext = new TextEncoder().encode(JSON.stringify(obj));
  const ciphertext = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, plaintext);
  return { v:1, salt: b64encode(salt), iv: b64encode(iv), data: b64encode(ciphertext) };
}

async function decryptJSON(payload, password){
  const salt = b64decode(payload.salt);
  const iv = b64decode(payload.iv);
  const key = await deriveKey(password, salt);
  const ciphertext = b64decode(payload.data);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ciphertext); // throws if password is wrong
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

async function syncSharedCopy(password){
  if (!sharedFileId) sharedFileId = await findOrCreateFile(CONFIG.sharedFileName, {});
  const encrypted = await encryptJSON(DB, password);
  await writeFileContent(sharedFileId, encrypted);
}

async function checkSharing(){
  sharedFileId = await findOrCreateFile(CONFIG.sharedFileName, {});
  const res = await driveApi(
    `https://www.googleapis.com/drive/v3/files/${sharedFileId}/permissions?fields=permissions(id,type,role)`,
    { headers: driveHeaders() }
  );
  const json = await res.json();
  const pub = (json.permissions || []).find(p => p.type === "anyone" && p.role === "reader");
  isPublic = !!pub;
  publicPermissionId = pub ? pub.id : null;
}

// Confirms a password against the CURRENT shared file (so a typo can't silently
// change what recipients need), then unlocks auto-sync for the rest of this session.
async function unlockSharingPassword(password){
  try{
    const current = await loadFileContent(sharedFileId); // owner reads via their own OAuth token
    await decryptJSON(current, password); // throws if wrong
    sharePassword = password;
    await syncSharedCopy(password); // push anything uploaded earlier this session that didn't sync
    return true;
  }catch(e){
    return false;
  }
}

async function makePublic(password){
  sharePassword = password;
  await syncSharedCopy(password);
  const res = await driveApi(
    `https://www.googleapis.com/drive/v3/files/${sharedFileId}/permissions`,
    { method: "POST", headers: { ...driveHeaders(), "Content-Type": "application/json" }, body: JSON.stringify({role:"reader", type:"anyone"}) }
  );
  const json = await res.json();
  isPublic = true;
  publicPermissionId = json.id;
  render();
}

async function stopSharing(){
  if (publicPermissionId){
    await driveApi(
      `https://www.googleapis.com/drive/v3/files/${sharedFileId}/permissions/${publicPermissionId}`,
      { method: "DELETE", headers: driveHeaders() }
    );
  }
  isPublic = false;
  publicPermissionId = null;
  render();
}

async function initApp(){
  const params = new URLSearchParams(window.location.search);
  const fileParam = params.get("file");

  if (fileParam){
    // Viewer mode — read-only, no sign-in, password-gated.
    sharedFileId = fileParam;
    try{
      viewerEncryptedPayload = await fetchPublicFile(fileParam);
      mode = "viewer-locked";
    }catch(e){
      console.error(e);
      mode = "viewer-error";
    }
    render();
    return;
  }

  // No ?file= param — this is the owner's editor view.
  mode = "editor-signedout";
  render();
}

async function tryViewerPassword(password){
  try{
    const decrypted = await decryptJSON(viewerEncryptedPayload, password);
    Object.assign(syllabusCache, decrypted.syllabi || {});
    if (decrypted.r26) DB.r26 = decrypted.r26;
    if (decrypted.tracks) DB.tracks = decrypted.tracks;
    mode = "viewer";
    render();
    return true;
  }catch(e){
    return false; // wrong password (AES-GCM auth tag fails) or malformed payload
  }
}

function connectDrive(){
  if (!window.google || !google.accounts || !google.accounts.oauth2){
    alert("Google Sign-In hasn't loaded yet — check your internet connection and try again.");
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.clientId,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: async (resp) => {
      if (resp.error){ alert("Sign-in failed: " + resp.error); return; }
      accessToken = resp.access_token;
      try{
        driveFileId = await findOrCreateFile(CONFIG.dataFileName, {syllabi:{}});
        const data = await loadFileContent(driveFileId);
        Object.assign(syllabusCache, data.syllabi || {});
        if (data.r26) DB.r26 = data.r26; // restore any subjects added to R26 in a previous session
        if (data.tracks) DB.tracks = data.tracks; // restore any Electives/Honours edits from a previous session
        await checkSharing();
        shareOutOfSync = isPublic; // fresh sign-in never has the password yet
        mode = "editor";
      }catch(e){
        console.error(e);
        alert("Could not connect to Drive: " + e.message);
      }
      render();
    },
  });
  tokenClient.requestAccessToken();
}

  const root = document.getElementById("curr-root");

  if (mode === "viewer-locked"){
    root.appendChild(buildViewerLockScreen());

  root.appendChild(buildModeBanner());

function buildSignInScreen(){
  return el(`<div style="padding:80px 32px;text-align:center;">
    <h1 style="font-size:24px;margin-bottom:8px;">B.Tech. CSE — Curriculum Ledger</h1>
    <div style="color:var(--ink-soft);margin-bottom:28px;">Connect your Google Drive to store and manage the curriculum.</div>
    <button class="btn gold" id="connect-btn" style="padding:12px 22px;font-size:14px;">Connect Google Drive</button>
  </div>`);
}
document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "connect-btn") connectDrive();
});

function buildViewerLockScreen(){
  const wrap = el(`<div style="padding:80px 32px;text-align:center;max-width:360px;margin:0 auto;">
    <h1 style="font-size:22px;margin-bottom:6px;">B.Tech. CSE — Curriculum Ledger</h1>
    <div style="color:var(--ink-soft);margin-bottom:22px;font-size:13px;">This link is password-protected. Enter the password you were given.</div>
    <input type="password" id="viewer-pw" class="paste-box" style="min-height:auto;padding:10px;text-align:center;" placeholder="Password">
    <div id="viewer-pw-error" style="color:var(--danger);font-size:12px;margin-top:8px;height:16px;"></div>
    <div class="row-gap" style="justify-content:center;margin-top:10px;">
      <button class="btn gold" id="viewer-pw-submit">Unlock</button>
    </div>
  </div>`);
  const input = wrap.querySelector("#viewer-pw");
  const err = wrap.querySelector("#viewer-pw-error");
  const submit = async () => {
    const pw = input.value;
    if (!pw) return;
    submitBtn.disabled = true;
    const ok = await tryViewerPassword(pw);
    if (!ok){ err.textContent = "Incorrect password — try again."; submitBtn.disabled = false; }
  };
  const submitBtn = wrap.querySelector("#viewer-pw-submit");
  submitBtn.onclick = submit;
  input.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  setTimeout(() => input.focus(), 0);
  return wrap;
}

async function exportAll(){
  const codes = Object.keys(syllabusCache);
  if (!codes.length){ alert("No syllabi uploaded yet."); return; }
  for (const code of codes){
    const course = courseByCode(code);
    const data = syllabusCache[code];
    if (!data) continue;
    const ext = data.format === "html" ? "html" : "txt";
    const blob = new Blob([data.content], {type: data.format === "html" ? "text/html" : "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (course ? course.name : code).replace(/[\\/:*?"<>|]/g,"-") + "." + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    await new Promise(r => setTimeout(r, 150));
  }
}

function buildR26TrackPool(kind){
  ensureTracks();
  const wrap = document.createElement("div");
  const label = kind === "honours" ? "Honours" : "Electives";
  const isEditor = mode === "editor";
  wrap.appendChild(el(`<div class="sem-title">${label} — by Track</div>`));
  wrap.appendChild(el(`<div class="sem-meta">${isEditor ? "Click a course name to attach its syllabus. Use the controls on the right to rename, delete, or move a course." : "Click any course to attach its syllabus"}</div>`));

  async function persistTracks(){ await saveDB(); render(); }

  DB.tracks.forEach((tr, ti) => {
    const list = kind === "honours" ? tr.honours : tr.elective;
    if (!list && !isEditor) return; // nothing to show a viewer for an empty honours track
    const block = document.createElement("div");
    block.className = "pool-block";
    block.appendChild(el(`<div class="pool-cat">${tr.track}</div>`));
    const table = document.createElement("table");
    table.className = "ledger";
    const tbody = document.createElement("tbody");

    (list || []).forEach((course, ii) => {
      const has = !!syllabusCache[course.code];
      const trEl = el(`<tr>
        <td class="course-row" style="cursor:pointer;">${course.name}</td>
        <td style="text-align:right;width:90px;"><span class="status-chip ${has?'up':'emp'}"><span class="d"></span>${has?'Uploaded':'Empty'}</span></td>
        ${isEditor ? `<td style="white-space:nowrap;text-align:right;">
          <button class="btn small" style="padding:3px 8px;" data-act="rename">Rename</button>
          <button class="btn small danger" style="padding:3px 8px;" data-act="delete">Delete</button>
          <select class="move-select" style="font-family:inherit;font-size:12px;padding:3px;border:1px solid var(--rule);background:var(--paper);margin-left:4px;">
            <option value="">Move to…</option>
          </select>
        </td>` : ""}
      </tr>`);
      trEl.querySelector("td.course-row").onclick = async () => { await loadSyllabus(course.code); modalCourse = course.code; render(); };

      if (isEditor){
        trEl.querySelector('[data-act="rename"]').onclick = async () => {
          const newName = prompt("Rename course:", course.name);
          if (newName && newName.trim() && newName.trim() !== course.name){
            course.name = newName.trim();
            await persistTracks();
          }
        };
        trEl.querySelector('[data-act="delete"]').onclick = async () => {
          if (!confirm(`Delete "${course.name}"? Any attached syllabus stays saved in Drive but becomes unattached.`)) return;
          list.splice(ii, 1);
          await persistTracks();
        };
        const moveSel = trEl.querySelector(".move-select");
        DB.tracks.forEach((destTr, dti) => {
          ["elective","honours"].forEach(destKind => {
            if (dti === ti && destKind === kind) return; // skip current location
            const optLabel = `${destTr.track} — ${destKind === "honours" ? "Honours" : "Electives"}`;
            moveSel.appendChild(el(`<option value="${dti}:${destKind}">${optLabel}</option>`));
          });
        });
        moveSel.onchange = async () => {
          const [destTiStr, destKind] = moveSel.value.split(":");
          if (!destTiStr) return;
          const destTi = parseInt(destTiStr);
          const destTr = DB.tracks[destTi];
          if (destKind === "honours" && !destTr.honours) destTr.honours = [];
          const destList = destKind === "honours" ? destTr.honours : destTr.elective;
          list.splice(ii, 1);
          destList.push(course);
          await persistTracks();
        };
      }
      tbody.appendChild(trEl);
    });

    if (isEditor){
      const addRow = el(`<tr><td colspan="3" style="padding:8px 10px;">
        <button class="btn small gold" data-act="add-course">+ Add course to ${tr.track}</button>
      </td></tr>`);
      addRow.querySelector('[data-act="add-course"]').onclick = async () => {
        const name = prompt(`New ${label.toLowerCase()} course name for ${tr.track}:`);
        if (!name || !name.trim()) return;
        if (kind === "honours" && !tr.honours) tr.honours = [];
        (kind === "honours" ? tr.honours : tr.elective).push({code:newCourseId(), name:name.trim()});
        await persistTracks();
      };
      tbody.appendChild(addRow);
    }

    table.appendChild(tbody);
    block.appendChild(table);
    wrap.appendChild(block);
  });
  return wrap;
}

      ${isEditor ? `<div class="row-gap">
        <button class="btn small danger" id="del-btn">Delete</button>
        <label class="file-label small" id="replace-label" style="font-size:12px;padding:6px 12px;">Replace with new file<input type="file" id="replace-file" accept=".txt,.md,.docx"></label>
      </div>` : ""}`;
    const stEl = area.querySelector(".syllabus-text");
    if (data.format === "html"){
      stEl.classList.add("rich");
      stEl.innerHTML = data.content;
    } else {
      stEl.textContent = data.content;
    }
    if (isEditor){
      area.querySelector("#del-btn").onclick = async () => { await deleteSyllabus(code); render(); };
      area.querySelector("#replace-file").onchange = (e) => handleSingleFile(e, code);
    }
  } else if (!isEditor){
    area.innerHTML = `<div class="empty-state">No syllabus attached yet.</div>`;
  } else {
    area.innerHTML = `
      <div class="empty-state">No syllabus attached yet.</div>
      <div class="row-gap">
        <label class="file-label">Upload file<input type="file" id="single-file" accept=".txt,.md,.docx"></label>
        <span style="font-size:12px;color:var(--empty);">or paste below</span>
      </div>
      <textarea class="paste-box" id="paste-box" placeholder="Paste syllabus text here..."></textarea>
      <div class="row-gap">
        <button class="btn gold small" id="save-paste">Save pasted text</button>
      </div>
      <div class="hint">Accepts .txt, .md, and .docx (read in-browser). For PDFs, paste the text instead.</div>`;
    area.querySelector("#single-file").onchange = (e) => handleSingleFile(e, code);
    area.querySelector("#save-paste").onclick = async () => {
      const txt = area.querySelector("#paste-box").value.trim();
      if (!txt) return;
      await saveSyllabus(code, txt, "pasted text");
      render();
    };
  }
  return overlay;
}

function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("read failed"));
    reader.readAsArrayBuffer(file);
  });
}

function readFileAsPlainText(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("read failed"));
    reader.readAsText(file);
  });
}

async function readFile(file){
  const lower = (file.name || "").toLowerCase();
  if (lower.endsWith(".docx")){
    const buf = await readFileAsArrayBuffer(file);
    if (window.mammoth){
      // convertToHtml preserves headings, bold/italic, lists and tables so it
      // reads like the original Word doc, not flattened plain text.
      const result = await window.mammoth.convertToHtml({arrayBuffer: buf});
      return {content: result.value, format: "html"};
    }
    throw new Error("docx reader unavailable");
  }
  const text = await readFileAsPlainText(file);
  return {content: text, format: "text"};
}

async function handleSingleFile(e, code){
  const file = e.target.files[0];
  if (!file) return;
  try{
    const {content, format} = await readFile(file);
    await saveSyllabus(code, content, file.name, format);
    render();
  }catch(err){
    alert("Could not read that file (" + (err && err.message ? err.message : err) + "). Try .txt, .md, .docx, or paste the text instead.");
  }
}

function buildBulkModal(){
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`<div class="modal wide">
    <button class="modal-close">✕</button>
    <h2>Bulk upload syllabi</h2>
    <div class="code">select multiple files — matched to subjects automatically where possible</div>
    <div class="row-gap">
      <label class="file-label">Choose files<input type="file" id="bulk-files" multiple accept=".txt,.md,.docx"></label>
    </div>
    <div class="hint">Filenames are matched to subject names automatically. Fix any unmatched or wrong matches below, then save.</div>
    <div class="bulk-list" id="bulk-list"></div>
    <div class="status-line" id="bulk-status"></div>
    <div class="row-gap" style="margin-top:14px;">
      <button class="btn gold" id="bulk-save">Save all matched</button>
    </div>
  </div>`);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay){ bulkOpen = false; render(); } };
  modal.querySelector(".modal-close").onclick = () => { bulkOpen = false; render(); };

  modal.querySelector("#bulk-files").onchange = async (e) => {
    const files = Array.from(e.target.files);
    bulkMatches = [];
    for (const file of files){
      let content = "", format = "text", readError = null;
      try{ const r = await readFile(file); content = r.content; format = r.format; }
      catch(err){ content = null; readError = err && err.message ? err.message : String(err); }
      const nf = normalize(file.name.replace(/\.[^.]+$/,""));
      let best = null, bestScore = 0;
      allCourses().forEach(c => {
        const nc = normalize(c.name);
        let score = 0;
        if (nc === nf) score = 100;
        else if (nc.includes(nf) || nf.includes(nc)) score = 60;
        if (score > bestScore){ bestScore = score; best = c.code; }
      });
      bulkMatches.push({filename:file.name, content, format, matchedCode: bestScore>0 ? best : null, readError});
    }
    renderBulkList(modal);
  };

  renderBulkList(modal);

  modal.querySelector("#bulk-save").onclick = async () => {
    let saved = 0;
    for (const m of bulkMatches){
      if (m.matchedCode && m.content !== null){
        await saveSyllabus(m.matchedCode, m.content, m.filename, m.format);
        saved++;
      }
    }
    modal.querySelector("#bulk-status").textContent = `Saved ${saved} of ${bulkMatches.length} files.`;
    setTimeout(() => { bulkOpen = false; render(); }, 700);
  };

  return overlay;
}

function renderBulkList(modal){
  const list = modal.querySelector("#bulk-list");
  list.innerHTML = "";
  bulkMatches.forEach((m, idx) => {
    const row = el(`<div class="bulk-item">
      <div class="fname" title="${m.filename}">${m.filename}</div>
      <select></select>
      <div>${m.readError ? '<span class="match-none">'+m.readError+'</span>' : (m.matchedCode ? '<span class="match-ok">matched</span>' : '<span class="match-none">no match</span>')}</div>
    </div>`);
    const select = row.querySelector("select");
    select.appendChild(el(`<option value="">— choose subject —</option>`));
    allCourses().forEach(c => {
      const opt = el(`<option value="${c.code}">${c.name}</option>`);
      if (c.code === m.matchedCode) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = (e) => { bulkMatches[idx].matchedCode = e.target.value || null; renderBulkList(modal); };
    list.appendChild(row);
  });
  const status = modal.querySelector("#bulk-status");
  if (status) status.textContent = bulkMatches.length ? `${bulkMatches.filter(m=>m.matchedCode).length} of ${bulkMatches.length} files matched.` : "";
}

initApp();
})();
</script>
